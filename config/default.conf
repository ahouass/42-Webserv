# Webserv Configuration File
# Inspired by NGINX server block syntax

# First server block - Main website on port 8080
server {
    listen 8080;                          # Port to listen on
    host 127.0.0.1;                       # Host address
    server_name localhost;                # Server name for request matching

    root /workspaces/42-Webserv/www;      # Root directory for this server
    index index.html;                     # Default file to serve

    client_max_body_size 10M;             # Max request body size (supports K, M, G)

    # Custom error pages
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # Location block for root path
    location / {
        methods GET POST;                 # Allowed HTTP methods
        autoindex off;                    # Directory listing disabled
    }

    # Location with directory listing enabled
    location /files {
        root /workspaces/42-Webserv/www/files;
        methods GET;
        autoindex on;                     # Enable directory listing
    }

    # Location for file uploads
    location /upload {
        root /workspaces/42-Webserv/www/upload;
        methods GET POST DELETE;
        upload_store /workspaces/42-Webserv/www/upload;  # Where to store uploads
        client_max_body_size 50M;         # Override body size for uploads
    }

    # Redirect example
    location /old-page {
        return 301 /new-page;             # HTTP redirection
    }

    # CGI configuration for Python scripts
    location /cgi-bin {
        root /workspaces/42-Webserv/www/cgi-bin;
        methods GET POST;
        cgi_extension .py;                # Execute .py files as CGI
        cgi_path /usr/bin/python3;        # Path to interpreter
    }

    # CGI configuration for PHP scripts (if needed)
    location /php {
        root /workspaces/42-Webserv/www/php;
        methods GET POST;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
    }
}

# Second server block - Different content on port 8081
server {
    listen 8081;
    host 127.0.0.1;
    server_name localhost;

    root /workspaces/42-Webserv/www2;
    index index.html;

    client_max_body_size 5M;

    error_page 404 /errors/404.html;

    location / {
        methods GET;
        autoindex off;
    }
}

