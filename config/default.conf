# webserv.conf - Configuration for 42 tester

server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    
    client_max_body_size 10M;
    error_page 404 /404.html;
    
    # Main route - GET only
    location / {
        methods GET;
        autoindex off;
    }
    
    # File uploads
    location /uploads {
        methods GET POST DELETE;
        upload_store ./www/uploads;
        client_max_body_size 50M;
    }
    
    # Directory listing
    location /files {
        methods GET;
        autoindex on;
    }
    
    # HTTP Redirection example
    location /old-page {
        return 301 /index.html;
    }
    
    location /google {
        return 302 https://www.google.com;
    }
    
    #CGI for Python
    location /cgi-bin {
        autoindex on;
        methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

# Second server on different port
server {
    listen 8081;
    server_name localhost;
    root ./www2;
    index index.html;
    
    location / {
        methods GET;
        autoindex off;
    }
}