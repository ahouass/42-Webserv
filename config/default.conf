# webserv.conf

# first server:
server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html;

	client_max_body_size 10M;
	error_page 404 /404.html;

	location / {
		methods GET POST;
		autoindex off;
	}

	location /old {
		return 301 /index.html;
	}

	location /uploads {
		methods GET POST DELETE;
		upload_store ./www/uploads;
		autoindex on;
		client_max_body_size 50M;
	}

	location /files {
		methods GET;
		autoindex on;
	}

	location /cgi-bin {
		autoindex on;
		methods GET POST;
		cgi .py /usr/bin/python3;
		cgi .pl /usr/bin/perl;
		cgi .sh /bin/bash;
		cgi .php /usr/bin/php-cgi;
		cgi * *;
	}
}

# Second server:
server {
	listen 8081;
	server_name localhost;
	root ./www2;
	index index.html;

	location / {
		methods GET;
		autoindex off;
	}
}
